apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui-2
spec:
  replicas: 6
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui-2
  template:
    metadata:
      labels:
        app: guestbook-ui-2
    spec:
      containers:
        - image: gcr.io/google-samples/gb-frontend:v5
          name: guestbook-ui-2
          ports:
            - containerPort: 80