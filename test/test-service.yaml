apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guestbook-ui-2
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
    - host: guestbook.k3s.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guestbook-ui-2
                port:
                  number: 80
                  nodePort: 30002